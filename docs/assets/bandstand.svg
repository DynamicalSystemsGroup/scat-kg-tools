<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 426" role="img" aria-labelledby="t d">
<title id="t">The four SCAT concepts as four linked cards</title>
<desc id="d">Four cards stacked top to bottom: Stakeholder groups, Concerns, Affordances, Technologies. Arrows between them read: holds, addressed by, provided by.</desc>
<rect x="20" y="16" width="320" height="64" rx="12" fill="#1c2570" stroke="#e0a526" stroke-width="2.5"/>
<circle cx="56" cy="48.0" r="21" fill="#e0a526"/><text x="56" y="57.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="25" font-weight="700" fill="#1c2570">S</text>
<text x="92" y="44" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff">Stakeholder groups</text>
<text x="92" y="66" font-family="system-ui, sans-serif" font-size="15" fill="#d7dcff">the voices</text>
<line x1="180" y1="83" x2="180" y2="123" stroke="#e0a526" stroke-width="3"/><polygon points="180,123 173,113 187,113" fill="#e0a526"/>
<rect x="194" y="91.0" width="132" height="24" rx="12" fill="#e8ebff"/><text x="260" y="108.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#1c2570">holds</text>
<rect x="20" y="126" width="320" height="64" rx="12" fill="#1c2570" stroke="#e0a526" stroke-width="2.5"/>
<circle cx="56" cy="158.0" r="21" fill="#e0a526"/><text x="56" y="167.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="25" font-weight="700" fill="#1c2570">C</text>
<text x="92" y="154" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff">Concerns</text>
<text x="92" y="176" font-family="system-ui, sans-serif" font-size="15" fill="#d7dcff">what they care about</text>
<line x1="180" y1="193" x2="180" y2="233" stroke="#e0a526" stroke-width="3"/><polygon points="180,233 173,223 187,223" fill="#e0a526"/>
<rect x="194" y="201.0" width="132" height="24" rx="12" fill="#e8ebff"/><text x="260" y="218.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#1c2570">addressed by</text>
<rect x="20" y="236" width="320" height="64" rx="12" fill="#1c2570" stroke="#e0a526" stroke-width="2.5"/>
<circle cx="56" cy="268.0" r="21" fill="#e0a526"/><text x="56" y="277.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="25" font-weight="700" fill="#1c2570">A</text>
<text x="92" y="264" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff">Affordances</text>
<text x="92" y="286" font-family="system-ui, sans-serif" font-size="15" fill="#d7dcff">what people can do</text>
<line x1="180" y1="303" x2="180" y2="343" stroke="#e0a526" stroke-width="3"/><polygon points="180,343 173,333 187,333" fill="#e0a526"/>
<rect x="194" y="311.0" width="132" height="24" rx="12" fill="#e8ebff"/><text x="260" y="328.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#1c2570">provided by</text>
<rect x="20" y="346" width="320" height="64" rx="12" fill="#1c2570" stroke="#e0a526" stroke-width="2.5"/>
<circle cx="56" cy="378.0" r="21" fill="#e0a526"/><text x="56" y="387.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="25" font-weight="700" fill="#1c2570">T</text>
<text x="92" y="374" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff">Technologies</text>
<text x="92" y="396" font-family="system-ui, sans-serif" font-size="15" fill="#d7dcff">the instruments</text>
</svg>
