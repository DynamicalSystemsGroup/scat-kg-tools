[project]
name = "scat-kg"
version = "0.1.0"
description = "Tools for checking and working on a SCAT knowledge-graph vault"
requires-python = ">=3.12"
dependencies = ["pydantic", "PyYAML", "rdflib"]

[project.optional-dependencies]
draw = ["matplotlib>=3.8"]
mcp = ["mcp>=1.2,<2", "uvicorn"]

[project.scripts]
scat = "scat_kg.cli:main"
scat-mcp = "scat_kg.mcp_server.__main__:main"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "matplotlib>=3.8",
    "mcp>=1.2,<2",
    "pytest",
    "ruff",
    "uvicorn",
]
docs = [
    "mkdocs-material>=9.8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scat_kg"]

[tool.hatch.build.targets.wheel.force-include]
"ontology/scat.ttl" = "scat_kg/scat.ttl"

[tool.ruff]
line-length = 100
extend-exclude = ["research", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
