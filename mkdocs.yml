site_name: SCAT
site_url: https://dynamicalsystemsgroup.github.io/scat-kg-tools/
strict: true

exclude_docs: |
  overrides/

theme:
  name: material
  custom_dir: docs/overrides
  font: false
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - assets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - The flow: flow.md
  - Data, rights and consent: data-and-consent.md
  - Getting started: getting-started.md
  - Planning: planning.md
  - Facilitating:
      - Scenarios: facilitate-scenarios.md
      - Architectures: facilitate-architectures.md
  - Coding: coding.md
  - Norms: norms.md
  - Coding in a chat: chat-path.md
  - Leave no trace: leave-no-trace.md
  - Coding in an IDE: ide.md
  - Analysis: analysis.md
  - Reference:
      - Python API: reference/api.md
      - CLI: reference/cli.md
      - MCP server: reference/mcp.md
      - Terms: reference/terms.md
      - Architecture: architecture.md
