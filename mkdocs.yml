site_name: SCAT
site_url: https://dynamicalsystemsgroup.github.io/scat-kg-tools/
strict: true

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Planning: planning.md
  - Facilitating:
      - Scenarios: facilitate-scenarios.md
      - Architectures: facilitate-architectures.md
  - Coding: coding.md
  - Reference:
      - Python API: reference/api.md
      - CLI: reference/cli.md
