[project]
name = "scat-analysis"
version = "0.0.0"
description = "RS2 research spike: graph analysis of SCAT vaults (not part of the scat_kg package)"
requires-python = ">=3.12"
dependencies = [
    "scat-kg",
    "networkx",
    "pandas",
    "matplotlib",
    "jupyter",
    "nbconvert",
    "ipykernel",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scat_analysis"]

[tool.uv.sources]
scat-kg = { path = "../..", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
