name: Image

# Build the MCP server's image to prove the recipe works. Never pushes (the release workflow does).
# Runs only when the recipe or the server's source changes: GitHub Actions minutes are scarce.
on:
  push:
    paths:
      - "deploy/**"
      - "src/scat_kg/mcp_server/**"
      - "tests/deploy/test_image.py"
      - ".github/workflows/image.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile -t scat-kg-tools:ci .
      # Run the image as the launcher does and draw through it (WP28-R4); stdlib only, so no uv or project install.
      - run: pip install pytest
      - run: SCAT_IMAGE_TEST=1 SCAT_IMAGE=scat-kg-tools:ci python -m pytest tests/deploy/test_image.py -q -p no:cacheprovider --rootdir . -c /dev/null
